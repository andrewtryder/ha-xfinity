[project]
name = "ha-xfinity"
version = "0.0.0"
description = "Home Assistant custom integration for Xfinity sensors and diagnostics"
readme = "README.md"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component==0.13.355",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov==7.1.0",
    "pytest-socket==0.8.0",
    "pre-commit==4.7.0",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "--cov=custom_components/xfinity --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
