name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Verify lockfile freshness
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --locked
      - name: Run pre-commit
        run: uv run --locked pre-commit run --all-files
      - name: Run Ruff lint
        run: uv run --locked ruff check .
      - name: Run Ruff format check
        run: uv run --locked ruff format --check . --exclude custom_components/xfinity
      - name: Run pytest
        run: uv run --locked pytest --disable-socket --allow-unix-socket

  pytest-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install latest dependencies and run tests
        run: |
          uv venv --python 3.14 .venv-latest
          uv pip install --python .venv-latest/bin/python --upgrade pytest pytest-cov pytest-socket pytest-homeassistant-custom-component
          .venv-latest/bin/python -c "from homeassistant.const import __version__; import importlib.metadata as m; print('Latest lane: HA={}, phacc={}'.format(__version__, m.version('pytest-homeassistant-custom-component')))"
          .venv-latest/bin/pytest --disable-socket --allow-unix-socket
